<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 원어민 표현</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #f3f5f7; --surface: #ffffff; --ink: #17202a; --muted: #5d6b78; --line: #dde3e9;
    --accent: #0f6e78; --accent-ink: #ffffff; --accent-soft: #e2f1f2;
    --good: #1d7a45; --good-soft: #e3f3e9;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171c; --surface: #1b2229; --ink: #e6ebef; --muted: #9aa7b3; --line: #2c353e;
      --accent: #4fb8c2; --accent-ink: #0d1a1c; --accent-soft: #173539;
      --good: #6fd29a; --good-soft: #183326; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  [hidden] { display: none !important; }
  .wrap { max-width: 680px; margin: 0 auto; padding-block: 28px 64px; display: grid; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--font-display); font-size: 1.75rem; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .date { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 7px; font: inherit; font-weight: 500; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { font: inherit; font-weight: 600; cursor: pointer; border-radius: 9px; padding: 9px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.small { padding: 5px 12px; font-size: .88rem; }
  .progress { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 8px; min-width: 0; }
  .meta { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .expr { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; line-height: 1.2; margin: 0; overflow-wrap: anywhere; }
  .meaning { font-weight: 700; margin: 0; }
  .situ { color: var(--muted); font-size: .92rem; margin: 0; }
  .example { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; display: grid; gap: 2px; }
  .example .ko { color: var(--muted); font-size: .88rem; }
  label { font-size: .86rem; color: var(--muted); }
  textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  textarea.note { min-height: 44px; font-size: .9rem; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: .8rem; color: var(--muted); }
  .attempt { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; display: grid; gap: 6px; }
  .mine { font-weight: 500; overflow-wrap: anywhere; }
  .pill { justify-self: start; font-size: .75rem; font-weight: 700; border-radius: 99px; padding: 2px 10px; background: var(--good-soft); color: var(--good); }
  .noteview { color: var(--muted); font-size: .9rem; white-space: pre-wrap; margin: 0; }
  .panel h2 { font-size: 1.05rem; margin: 0; }
  .panel p { margin: 0; }
  .steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: .92rem; }
  .copied { color: var(--good); font-size: .88rem; }
  details.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  details.day summary { cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  details.day summary span { font-weight: 400; color: var(--muted); font-size: .88rem; }
  details.day .card { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 14px 0 4px; margin-top: 10px; }
  .stats { color: var(--muted); font-size: .9rem; margin: 0; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>오늘의 원어민 표현</h1>
      <p class="date" id="date"></p>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="today">오늘</button>
      <button role="tab" aria-selected="false" data-view="history">기록</button>
      <button role="tab" aria-selected="false" data-view="backup">백업</button>
    </div>
  </header>
  <section id="view"></section>
</main>

const STORE = "native-expr-offline-v1";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
$("date").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

// ---------- 저장 ----------
function load() {
  try { const d = JSON.parse(localStorage.getItem(STORE)); if (d && d.days) return d; } catch (_) {}
  return { days: {}, order: null, next: 0 };
}
let data = load();
function save() { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (_) {} }

function shuffled(n) {
  const a = [...Array(n).keys()];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function ensureToday() {
  const key = todayKey();
  if (data.days[key]) return data.days[key];
  if (!Array.isArray(data.order) || data.order.length !== BANK.length) { data.order = shuffled(BANK.length); data.next = 0; }
  const picks = [];
  for (let k = 0; k < 5; k++) {
    if (data.next >= data.order.length) { data.order = shuffled(BANK.length); data.next = 0; }
    picks.push(data.order[data.next++]);
  }
  data.days[key] = { items: picks.map((i) => ({ bank: i, attempts: [] })) };
  save();
  return data.days[key];
}
const entry = (item) => BANK[item.bank] || ["", "", "", "", ""];

// ---------- 교정 요청 문구 ----------
function buildPrompt(day) {
  const lines = day.items.map((it) => {
    const [ex, mean] = entry(it);
    const sents = it.attempts.map((a) => `- ${a.sentence}`).join("\n");
    return sents ? `[${ex}] (${mean})\n${sents}` : "";
  }).filter(Boolean).join("\n\n");
  return `저는 원어민 수준의 영어를 목표로 공부하는 한국인이에요. 오늘 배운 표현으로 직접 문장을 만들어 봤어요.\n`
    + `문장마다 아래 형식으로 교정해 주세요.\n`
    + `1) 자연스러운지 여부 (자연스러움 / 다듬기 필요)\n2) 원어민이라면 어떻게 말할지\n3) 다른 자연스러운 표현 1~2개\n4) 고칠 점과 이유를 한국어로 짧게\n\n`
    + lines;
}

// ---------- 화면 ----------
let view = "today";
let copiedMsg = "";
const drafts = {};

function cardHTML(item, idx, editable) {
  const [ex, mean, situ, eg, egKo] = entry(item);
  const attempts = item.attempts.map((a, j) => `
    <div class="attempt">
      <div class="mine">${esc(a.sentence)}</div>
      ${editable
        ? `<label for="note-${idx}-${j}">Claude에게 받은 교정 메모</label>
           <textarea class="note" id="note-${idx}-${j}" data-note="${idx}-${j}" placeholder="교정 결과를 붙여 넣어 두면 나중에 다시 볼 수 있어요.">${esc(a.note || "")}</textarea>`
        : (a.note ? `<span class="pill">교정 메모</span><p class="noteview">${esc(a.note)}</p>` : "")}
    </div>`).join("");
  return `<article class="card">
    <div class="meta"><span>${idx + 1} / 5</span><span>${item.attempts.length ? `문장 ${item.attempts.length}개` : ""}</span></div>
    <h2 class="expr">${esc(ex)}</h2>
    <p class="meaning">${esc(mean)}</p>
    <p class="situ">${esc(situ)}</p>
    <div class="example"><span>${esc(eg)}</span><span class="ko">${esc(egKo)}</span></div>
    ${editable ? `
      <label for="draft-${idx}">주어, 시제, 상황을 바꿔서 내 문장을 써 보세요.</label>
      <textarea id="draft-${idx}" data-draft="${idx}" placeholder="예: I'm so swamped with homework this week.">${esc(drafts[idx] || "")}</textarea>
      <div class="row"><button class="btn small" data-add="${idx}">문장 저장</button><span class="hint">Ctrl + Enter</span></div>` : ""}
    ${attempts}
  </article>`;
}

function todayHTML() {
  const day = ensureToday();
  const done = day.items.filter((i) => i.attempts.length).length;
  const total = day.items.reduce((n, i) => n + i.attempts.length, 0);
  return `<div class="progress"><span>오늘 연습한 표현 ${done} / 5</span><span class="bar"><i style="width:${done * 20}%"></i></span></div>`
    + day.items.map((it, i) => cardHTML(it, i, true)).join("")
    + `<div class="panel">
        <h2>Claude에게 교정받기</h2>
        <ol class="steps">
          <li>아래 버튼을 누르면 오늘 쓴 문장이 교정 요청 문구로 복사돼요.</li>
          <li>열린 claude.ai 창에 붙여 넣고(Ctrl + V) 보내세요.</li>
          <li>받은 교정을 각 문장 아래 메모 칸에 붙여 넣어 두세요.</li>
        </ol>
        <div class="row">
          <button class="btn" id="copyPrompt" ${total ? "" : "disabled"}>교정 요청 복사하고 claude.ai 열기</button>
          <span class="copied" id="copied">${esc(copiedMsg)}</span>
        </div>
        ${total ? "" : `<p class="hint">문장을 하나 이상 저장하면 버튼이 켜져요.</p>`}
        <textarea id="promptBox" hidden readonly></textarea>
      </div>`;
}

function historyHTML() {
  const keys = Object.keys(data.days).sort().reverse();
  if (!keys.length) return `<div class="panel"><p>아직 기록이 없어요.</p></div>`;
  const sents = keys.reduce((n, k) => n + data.days[k].items.reduce((m, i) => m + i.attempts.length, 0), 0);
  return `<p class="stats">지금까지 ${keys.length}일 · 표현 ${keys.length * 5}개 · 내가 쓴 문장 ${sents}개 · 전체 표현 ${BANK.length}개 중 ${Math.min(new Set(keys.flatMap((k) => data.days[k].items.map((i) => i.bank))).size, BANK.length)}개 배움</p>`
    + keys.map((k, n) => {
      const d = data.days[k]; const done = d.items.filter((x) => x.attempts.length).length;
      return `<details class="day" ${n === 0 ? "open" : ""}><summary>${esc(k)}<span>${done} / 5 연습</span></summary>${d.items.map((it, i) => cardHTML(it, i, false)).join("")}</details>`;
    }).join("");
}

function backupHTML() {
  return `<div class="panel">
    <h2>기록 백업</h2>
    <p class="hint">기록은 이 컴퓨터의 이 브라우저에만 저장돼요. 브라우저 데이터를 지우면 함께 사라지니 가끔 백업 파일을 받아 두세요.</p>
    <div class="row">
      <button class="btn" id="exportBtn">백업 파일 받기</button>
      <label class="btn ghost" for="importFile" style="font-size:inherit;color:var(--accent)">백업 불러오기</label>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
    <p class="copied" id="backupMsg"></p>
  </div>`;
}

function render() {
  $("view").innerHTML = `<div style="display:grid;gap:16px">${view === "today" ? todayHTML() : view === "history" ? historyHTML() : backupHTML()}</div>`;
}

// ---------- 이벤트 ----------
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  view = b.dataset.view;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  render();
}));

function addSentence(idx) {
  const ta = $("draft-" + idx);
  const s = ta && ta.value.trim();
  if (!s) return;
  ensureToday().items[idx].attempts.push({ sentence: s, note: "", at: Date.now() });
  drafts[idx] = "";
  save(); copiedMsg = ""; render();
  $("draft-" + idx)?.focus();
}

$("view").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.add != null) addSentence(+b.dataset.add);
  if (b.id === "copyPrompt") {
    const text = buildPrompt(ensureToday());
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {}
    if (!ok) {
      const box = $("promptBox"); box.hidden = false; box.value = text; box.style.minHeight = "160px"; box.select();
      try { ok = document.execCommand("copy"); } catch (_) {}
    }
    copiedMsg = ok ? "복사했어요. claude.ai 창에 붙여 넣으세요." : "자동 복사가 안 돼서 아래 문구를 직접 복사해 주세요.";
    $("copied").textContent = copiedMsg;
    window.open("https://claude.ai/new", "_blank", "noopener");
  }
  if (b.id === "exportBtn") {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `원어민표현_백업_${todayKey()}.json`; a.click();
    $("backupMsg").textContent = "백업 파일을 내려받았어요.";
  }
});

$("view").addEventListener("keydown", (e) => {
  const t = e.target;
  if (t.dataset.draft != null && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addSentence(+t.dataset.draft); }
});

$("view").addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.draft != null) drafts[t.dataset.draft] = t.value;
  if (t.dataset.note) {
    const [i, j] = t.dataset.note.split("-").map(Number);
    const a = ensureToday().items[i].attempts[j];
    if (a) { a.note = t.value; save(); }
  }
});

$("view").addEventListener("change", async (e) => {
  if (e.target.id !== "importFile") return;
  const file = e.target.files[0]; if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    if (!parsed || typeof parsed.days !== "object") throw new Error();
    data = parsed; save();
    $("backupMsg").textContent = "백업을 불러왔어요.";
  } catch (_) {
    $("backupMsg").textContent = "올바른 백업 파일이 아니에요.";
  }
});

render();
</script>
</body>
</html>
